<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Student - MealMate</title>
    <style>
        html[data-theme='light'] {
            --primary: #000000;
            --secondary: #333333;
            --background: #e1d9cc;
            --card-bg: #ffffff;
            --text: #000000;
            --text-secondary: #666666;
            --border: #ddd;
            --table-stripe: #f8f8f8;
            --table-hover: #eee;
        }

        html[data-theme='dark'] {
            --primary: #ffffff;
            --secondary: #cccccc;
            --background: #1a1a1a;
            --card-bg: #2d2d2d;
            --text: #ffffff;
            --text-secondary: #999999;
            --border: #444;
            --table-stripe: #333333;
            --table-hover: #404040;
        }

        html[data-theme='light'] .logo img.light-logo {
            display: block;
        }

        html[data-theme='dark'] .logo img.dark-logo {
            display: block;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--background);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        .header {
            padding: 20px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .logo img.light-logo {
            display: none;
            width: 100px;
            height: 100px;
        }

        .logo img.dark-logo {
            display: none;
            width: 100px;
            height: 100px;
        }

        .logo-text {
            font-size: 24px;
            font-weight: bold;
            color: var(--text);
        }

        .theme-switch-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .theme-switch {
            position: relative;
            width: 60px;
            height: 34px;
        }

        .theme-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--secondary);
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: var(--card-bg);
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--text);
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        .theme-label {
            color: var(--text);
        }

        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .registration-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 800px;
            transition: all 0.3s ease;
        }

        h1 {
            color: var(--text);
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: var(--card-bg);
            color: var(--text);
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .photo-upload {
            border: 2px dashed var(--border);
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .photo-preview {
            max-width: 200px;
            margin-top: 10px;
            display: none;
            border-radius: 8px;
        }

        .btn {
            background: var(--primary);
            color: var(--card-bg);
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-secondary);
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            
            .registration-card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <img src="img/2.png" alt="MealMate Light Logo" class="light-logo">
            <img src="img/1.png" alt="MealMate Dark Logo" class="dark-logo">
            <span class="logo-text">MealMate</span>
        </div>
        <div class="theme-switch-wrapper">
            <span class="theme-label">🌞</span>
            <label class="theme-switch">
                <input type="checkbox" id="theme-toggle">
                <span class="slider"></span>
            </label>
            <span class="theme-label">🌙</span>
        </div>
    </header>

    <div class="container">
        <div class="registration-card">
            <h1>Add New Student</h1>
            <form method="POST" action="{{ url_for('add_student') }}">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="Name">Full Name</label>
                        <input type="text" id="Name" name="Name" required>
                    </div>

                    <div class="form-group">
                        <label for="registration_no">Registration Number</label>
                        <input type="text" id="registration_no" name="registration_no" required>
                    </div>

                    <div class="form-group">
                        <label for="Email">Email ID</label>
                        <input type="email" id="Email" name="Email" required>
                    </div>

                    <div class="form-group">
                        <label for="mobile">Mobile Number</label>
                        <input type="tel" id="mobile" name="mobile" required>
                    </div>

                    <div class="form-group">
                        <label for="guardianName">Guardian Name</label>
                        <input type="text" id="guardianName" name="guardianName" required>
                    </div>

                    <div class="form-group">
                        <label for="guardianMobile">Guardian Mobile Number</label>
                        <input type="tel" id="guardianMobile" name="guardianMobile" required>
                    </div>

                    <div class="form-group">
                        <label for="RoomNo">Room Number</label>
                        <input type="text" id="RoomNo" name="RoomNo" required>
                    </div>

                    <div class="form-group">
                        <label for="year">Year of Study</label>
                        <select id="year" name="year" required>
                            <option value="">Select Year</option>
                            <option value="1st Year">1st Year</option>
                            <option value="2nd Year">2nd Year</option>
                            <option value="3rd Year">3rd Year</option>
                            <option value="4th Year">4th Year</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="branch">Branch</label>
                        <select id="branch" name="branch" required>
                            <option value="">Select Branch</option>
                            <option value="CSE">Computer Science</option>
                            <option value="ECE">Electronics</option>
                            <option value="ME">Mechanical</option>
                            <option value="CE">Civil</option>
                            <option value="EE">Electrical</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="Password">Password</label>
                        <input type="password" id="Password" name="Password" required>
                    </div>

                    <div class="form-group full-width">
                        <button type="submit" class="btn">Add Student</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <footer>
        <p>© 2025 MealMate. All rights reserved.</p>
    </footer>

    <script>
        // Theme toggle functionality
        const toggleSwitch = document.getElementById('theme-toggle');
        const html = document.documentElement;

        // Check for saved theme preference
        const currentTheme = localStorage.getItem('theme');
        if (currentTheme) {
            html.setAttribute('data-theme', currentTheme);
            toggleSwitch.checked = currentTheme === 'dark';
        }

        // Theme switch handler
        toggleSwitch.addEventListener('change', function(e) {
            if (e.target.checked) {
                html.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            } else {
                html.setAttribute('data-theme', 'light');
                localStorage.setItem('theme', 'light');
            }
        });

        // Photo preview functionality
        document.getElementById('photo').addEventListener('change', function(e) {
            const preview = document.getElementById('photoPreview');
            const file = e.target.files[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = 'block';
            }

            if (file) {
                reader.readAsDataURL(file);
            }
        });

        // Form submission handler
        function handleRegistration(event) {
            event.preventDefault();
            
            // Basic form validation
            const form = event.target;
            const formData = new FormData(form);
            let isValid = true;

            // Check if all required fields are filled
            for (let [key, value] of formData.entries()) {
                if (!value && key !== 'photo') {
                    isValid = false;
                    break;
                }
            }

            if (isValid) {
                alert('Student registration successful!');
                window.location.href = 'alogin.html';
            } else {
                alert('Please fill in all required fields.');
            }
        }
    </script>
</body>
</html>
