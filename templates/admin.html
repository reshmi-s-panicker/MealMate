<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - MealMate</title>
    <style>
        /* Theme variables updated to match second file */
        html[data-theme='light'] {
            --primary: #000000;
            --secondary: #333333;
            --background: #e1d9cc;
            --card-bg: #ffffff;
            --text: #000000;
            --text-secondary: #666666;
            --border: #ddd;
            --table-stripe: #f8f8f8;
            --table-hover: #eee;
        }

        html[data-theme='dark'] {
            --primary: #ffffff;
            --secondary: #cccccc;
            --background: #1a1a1a;
            --card-bg: #2d2d2d;
            --text: #ffffff;
            --text-secondary: #999999;
            --border: #444;
            --table-stripe: #333333;
            --table-hover: #404040;
        }

        html[data-theme='light'] .logo img.light-logo {
            display: block;
        }

        html[data-theme='dark'] .logo img.dark-logo {
            display: block;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--background);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        .header {
            padding: 20px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .logo img.light-logo {
            display: none;
            width: 100px;
            height: 100px;
        }

        .logo img.dark-logo {
            display: none;
            width: 100px;
            height: 100px;
        }

        .logo-text {
            font-size: 24px;
            font-weight: bold;
            color: var(--text);
        }

        .theme-switch-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .theme-switch {
            position: relative;
            width: 60px;
            height: 34px;
        }

        .theme-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--secondary);
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: var(--card-bg);
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--text);
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        .theme-label {
            color: var(--text);
        }

        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            transition: all 0.3s ease;
        }

        h1 {
            color: var(--text);
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: var(--card-bg);
            color: var(--text);
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .error-message {
            color: #e53e3e;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }

        .btn {
            background: var(--primary);
            color: var(--card-bg);
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .forgot-password {
            text-align: center;
            margin-top: 20px;
        }

        .forgot-password a {
            color: var(--primary);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-secondary);
        }

        .back-btn {
            background-color: var(--primary);
            color: var(--card-bg);
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            position: fixed;
            bottom: 20px;
            left: 20px;
            transition: 0.3s ease;
        }

        .back-btn:hover {
            background-color: var(--secondary);
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .card-content {
            text-align: center;
        }

        .card h3 {
            color: var(--text);
            font-size: 18px;
            margin-bottom: 10px;
        }

        .card p {
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .card a {
            background: var(--primary);
            color: var(--card-bg);
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            transition: background 0.3s;
        }

        .card a:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <img src="img/2.png" alt="MealMate Light Logo" class="light-logo">
            <img src="img/1.png" alt="MealMate Dark Logo" class="dark-logo">
            <span class="logo-text">MealMate</span>
        </div>
        <div class="theme-switch-wrapper">
            <span class="theme-label">🌞</span>
            <label class="theme-switch">
                <input type="checkbox" id="theme-toggle">
                <span class="slider"></span>
            </label>
            <span class="theme-label">🌙</span>
        </div>
    </header>

    <button class="back-btn" onclick="goBack()">⬅ Back</button>

    <div class="container">
        <div class="login-card">
            <h1>Admin Login</h1>
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            <form method="POST" action="{{ url_for('admin') }}">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn">Login</button>
            </form>
            <div class="forgot-password">
                <a href="{{ url_for('index') }}">Back to Home</a>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2025 MealMate. All rights reserved.</p>
    </footer>

    <script>
        const toggleSwitch = document.getElementById('theme-toggle');
        const html = document.documentElement;

        // Check for saved theme preference
        const currentTheme = localStorage.getItem('theme');
        if (currentTheme) {
            html.setAttribute('data-theme', currentTheme);
            toggleSwitch.checked = currentTheme === 'dark';
        }

        // Theme switch handler
        toggleSwitch.addEventListener('change', function(e) {
            if (e.target.checked) {
                html.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            } else {
                html.setAttribute('data-theme', 'light');
                localStorage.setItem('theme', 'light');
            }
        });

        function goBack() {
            window.location.href = 'index.html';
            }

        function handleLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            // Reset error messages
            document.getElementById('username-error').style.display = 'none';
            document.getElementById('password-error').style.display = 'none';
            
            // Simple validation
            let isValid = true;
            
            if (!username) {
                document.getElementById('username-error').style.display = 'block';
                isValid = false;
            }
            
            if (password.length < 6) {
                document.getElementById('password-error').style.display = 'block';
                isValid = false;
            }
            
            if (isValid) {
                alert('Login successful! Redirecting to dashboard...');
                window.location.href = 'alogin.html';
            }
        }
    </script>
</body>
</html>
