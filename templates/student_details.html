<!-- Add this button at the top of the student details section -->
<div class="action-buttons">
    <form action="{{ url_for('delete_student', student_id=student.StudentID) }}" method="POST" 
          onsubmit="return confirm('Are you sure you want to delete this student? This action cannot be undone.');">
        <button type="submit" class="delete-btn">
            <i class="fas fa-trash"></i> Delete Student
        </button>
    </form>
</div>

<style>
    .action-buttons {
        margin-bottom: 20px;
        display: flex;
        justify-content: flex-end;
    }
    
    .delete-btn {
        background-color: #dc3545;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: background-color 0.3s;
    }
    
    .delete-btn:hover {
        background-color: #c82333;
    }
    
    .delete-btn i {
        font-size: 16px;
    }
</style>
